[package]
name = "kuaka"
version = "0.1.0"
edition = "2021"
description = "The Fiordland Linux update manager"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
notify-rust = "4"
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.19"
ureq = "2"

[build-dependencies]
slint-build = "1.19"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
